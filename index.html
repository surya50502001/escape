<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>THE PIT - 10-Player Prison Break Survival</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background-color: #0b0c10;
      color: #e0e6ed;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    header {
      width: 1000px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
    }
    h1 {
      font-size: 20px;
      letter-spacing: 2px;
      font-weight: 900;
      color: #f8fafc;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .badge {
      background: #e74c3c;
      color: #fff;
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 4px;
      letter-spacing: 1px;
    }
    .top-controls {
      display: flex;
      gap: 12px;
      align-items: center;
    }
    #status {
      font-family: monospace;
      font-size: 13px;
      color: #94a3b8;
    }
    button {
      background: #1e293b;
      color: #38bdf8;
      border: 1px solid #334155;
      padding: 6px 14px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    button:hover {
      background: #334155;
      color: #fff;
    }
    #canvas-container {
      position: relative;
      width: 1000px;
      height: 700px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8), 0 0 1px 1px #334155;
      border-radius: 8px;
      overflow: hidden;
      background: #000;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    footer {
      width: 1000px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 10px;
      padding: 8px 14px;
      background: #0f172a;
      border-radius: 6px;
      border: 1px solid #1e293b;
      font-size: 13px;
    }
    .controls-hint {
      display: flex;
      gap: 15px;
    }
    .key-badge {
      background: #334155;
      color: #f1f5f9;
      padding: 2px 6px;
      border-radius: 4px;
      font-family: monospace;
      font-weight: bold;
      font-size: 11px;
    }
    .rule-hint {
      color: #f87171;
      font-weight: 600;
      font-family: monospace;
    }
  </style>
</head>
<body>

  <header>
    <h1>THE PIT <span class="badge">PRISON BREAK SURVIVAL</span></h1>
    <div class="top-controls">
      <div id="status">CONNECTING...</div>
      <button id="audioBtn">🔊 Audio: ON</button>
    </div>
  </header>

  <div id="canvas-container">
    <canvas id="gameCanvas" width="1000" height="700"></canvas>
  </div>

  <footer>
    <div class="controls-hint">
      <span><span class="key-badge">A/D</span> Run</span>
      <span><span class="key-badge">W</span> Jump / Climb Wall Pipe</span>
      <span><span class="key-badge">S</span> Drop Off Pipe</span>
      <span><span class="key-badge">E</span> Pick Up Rope</span>
      <span><span class="key-badge">CLICK</span> Throw Rope / Rock</span>
      <span><span class="key-badge">SPACE</span> Yank Rope / Tackle</span>
    </div>
    <div class="rule-hint">
      ⚠️ Route: Climb right wall pipe ➔ Traverse ceiling pipe ➔ Escape upper-left hatch!
    </div>
  </footer>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
